<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job history — TickLinks</title>
  <link rel="stylesheet" href="assets/dashboard.css" />
</head>
<body class="job-page">
  <aside class="sidebar">
    <div class="brand">
      <strong>TICKLINKS</strong>
      <span>Background processes</span>
    </div>
    <nav class="nav">
      <a href="index.html">Recurring jobs</a>

    <div class="side-meta" id="side-meta"></div>

  <div class="main">
    <header class="topbar">
      <div>
        <a class="back-link" href="index.html">All jobs</a>

      <section class="panel day-panel" id="days"></section>
      <section class="panel" id="view"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <script src="assets/format.js"></script>
